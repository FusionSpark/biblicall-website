# Biblicall AI worker: answers + North Star. Lives in the hello@biblicall.com Cloudflare account (with biblicall-rooms).
# The Anthropic key is the secret ANTHROPIC_API_KEY, set in the Cloudflare dashboard (never in this repo).
name = "biblicall-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"
keep_vars = true

# Fair-use limits (per 60 seconds).
[[ratelimits]]
name = "VISITOR_LIMIT"
namespace_id = "7101"
simple = { limit = 20, period = 60 }

# All live calls together (safety cap).
[[ratelimits]]
name = "ROOMS_LIMIT"
namespace_id = "7102"
simple = { limit = 600, period = 60 }

# Each live call on its own, so one busy room never slows the others.
[[ratelimits]]
name = "ROOM_LIMIT"
namespace_id = "7103"
simple = { limit = 40, period = 60 }

# Workers AI (Whisper) turns microphone recordings into text.
[ai]
binding = "AI"

# Daily fair-use counters (one small Durable Object per visitor or call per day).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
