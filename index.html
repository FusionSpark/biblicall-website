<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblicall — Your North Star, built in</title>
<meta name="description" content="Ask Biblicall anything. A full AI assistant for entrepreneurs, with a moral North Star built in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#eaf5fc; --sky-bottom:#cfe7f6; --sky-deep:#2f6690;
    --earth:#664336; --earth-deep:#4a2f26; --card:#ffffff;
    --ink:#1e3646; --muted:#5c7688; --line:#c3ddec;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
  .wrap{width:100%;max-width:680px;text-align:center}
  .logo{height:95px;width:auto;margin-bottom:22px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(24px,4vw,34px);
     color:var(--earth-deep);margin:0 0 34px;line-height:1.3}
  .composer{background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 8px 28px rgba(47,102,144,.12);padding:8px 8px 8px 20px;
    display:flex;align-items:flex-end;gap:8px;text-align:left}
  .composer textarea{flex:1;border:none;outline:none;resize:none;font-family:inherit;
    font-size:16px;line-height:1.5;color:var(--ink);padding:12px 0;background:transparent;
    max-height:160px}
  .composer textarea::placeholder{color:var(--muted)}
  .send{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:none;
    background:var(--earth);color:#fff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .send:hover{background:var(--earth-deep)}
  .send svg{width:18px;height:18px}
  .send:disabled{opacity:.55;cursor:default}
  .thread{display:none;margin-top:20px;text-align:left}
  .thread.show{display:block}
  .msg-row{display:flex;margin-bottom:16px}
  .msg-row.assistant{justify-content:flex-start}
  .msg-row.user{justify-content:flex-end}
  .msg{font-size:16px;line-height:1.65;white-space:pre-wrap}
  .msg.assistant{color:var(--ink);max-width:100%}
  .msg.assistant.loading{color:var(--muted);font-style:italic}
  .msg.user{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:12px 18px;max-width:80%;color:var(--ink)}
  .emailstep{display:none;margin-top:18px;text-align:left}
  body.chatting .center{justify-content:flex-start;padding-top:28px}
  body.chatting .logo,body.chatting h1{display:none}
  body.chatting .thread{padding-bottom:190px}
  body.chatting .composer-dock{position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 20px 22px;
    background:linear-gradient(180deg, rgba(207,231,246,0) 0%, var(--sky-bottom) 45%)}
  body.chatting .composer-dock .composer{width:100%;max-width:680px}
  body.chatting .composer-dock .emailstep{width:100%;max-width:680px;margin-top:14px}
  body.chatting .composer-dock .emailstep p{font-size:13px;margin:0 0 8px}
  .emailstep.show{display:block}
  .emailstep p{font-size:14px;color:var(--muted);margin:0 0 10px}
  .emailrow{display:flex;gap:8px;flex-wrap:wrap}
  .emailrow input{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);
    border-radius:10px;font-size:15px;font-family:inherit}
  .emailrow button{padding:12px 18px;border:none;border-radius:10px;background:var(--earth);
    color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
  .emailrow button:hover{background:var(--earth-deep)}
  footer{text-align:center;padding:22px 20px;font-size:13px;color:var(--muted)}
  footer a{color:var(--earth)}
</style>
</head>

    <h1>What are you building today?</h1>

    <div class="composer-dock" id="composerDock">
      <div class="composer">
        <textarea id="q" rows="1" placeholder="Ask Biblicall anything — business, life, hard calls..."></textarea>
        <button class="send" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>

      <div class="emailstep" id="emailStep">
        <p>Want to save this answer or get early access when Biblicall fully launches? Leave your email below.</p>
        <form class="emailrow" id="emailForm" action="mailto:hello@biblicall.com" method="post" enctype="text/plain">
          <input type="email" id="email" name="email" placeholder="you@email.com" required>
          <button type="submit">Notify Me</button>
        </form>
      </div>
    </div>

    <div class="thread" id="thread"></div>
  </div>
</div>

<footer>Coming soon &middot; <a href="mailto:hello@biblicall.com">hello@biblicall.com</a></footer>

<script>
  const WORKER_URL = 'https://noisy-morning-3bbc.graphics-a4c.workers.dev';

  const q = document.getElementById('q');
  const sendBtn = document.getElementById('sendBtn');
  const threadBox = document.getElementById('thread');
  const emailStep = document.getElementById('emailStep');
  const emailForm = document.getElementById('emailForm');

  let conversation = [];

  q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatAnswer(str) {
    let s = escapeHtml(str);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|\n)[-*]\s+/g, '$1• ');
    return s;
  }

  function renderThread() {
    threadBox.innerHTML = '';
    let lastRow = null;
    conversation.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.role;
      const bubble = document.createElement('div');
      bubble.className = 'msg ' + m.role + (m.loading ? ' loading' : '');
      if (m.role === 'assistant' && !m.loading) {
        bubble.innerHTML = formatAnswer(m.content);
      } else {
        bubble.textContent = m.content;
      }
      row.appendChild(bubble);
      threadBox.appendChild(row);
      lastRow = row;
    });
    if (lastRow) {
      const dock = document.getElementById('composerDock');
      const dockHeight = dock ? dock.offsetHeight : 0;
      const targetTop = lastRow.offsetTop + lastRow.offsetHeight - window.innerHeight + dockHeight + 24;
      window.scrollTo({ top: Math.max(targetTop, 0), behavior: 'smooth' });
    }
  }

  async function reveal() {
    const question = q.value.trim();
    if (question.length === 0) { q.focus(); return; }

    document.body.classList.add('chatting');
    sendBtn.disabled = true;
    q.value = '';
    q.style.height = 'auto';

    conversation.push({ role: 'user', content: question });
    conversation.push({ role: 'assistant', content: 'Thinking…', loading: true });
    threadBox.classList.add('show');
    renderThread();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conversation.filter((m) => !m.loading).map(({ role, content }) => ({ role, content }))
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Upstream error');
      conversation[conversation.length - 1] = { role: 'assistant', content: data.answer };
    } catch (err) {
      conversation[conversation.length - 1] = {
        role: 'assistant',
        content: "Biblicall couldn't answer that just now. Leave your email below and we'll follow up with a real answer personally."
      };
    }
    renderThread();

    sendBtn.disabled = false;
    q.focus();
    emailStep.classList.add('show');
    emailForm.action = 'mailto:hello@biblicall.com?subject=' + encodeURIComponent('Biblicall waitlist') +
      '&body=' + encodeURIComponent('My question: ' + question);
  }
  sendBtn.addEventListener('click', reveal);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); reveal(); }
  });
</script>
</body>
</html>
